name: SCRAWL CI

on:
  push:
    branches: [ main, develop, fix/v1.2 ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo test (debug)
      run: cargo test --all

    - name: Cargo test (release)
      run: cargo test --release

    - name: Run examples
      run: |
        cargo run --example heartbeat
        cargo run --example idioms

    - name: Check zero runtime dependencies
      # Pure Python so this step is not bash-specific (Windows runners use pwsh).
      run: |
        cargo metadata --no-deps --format-version 1 | python3 -c "
        import json, sys
        meta = json.load(sys.stdin)
        for pkg in meta['packages']:
            if pkg['name'] == 'scrawl':
                runtime = [d for d in pkg['dependencies'] if not d.get('kind')]
                if runtime:
                    print('ERROR: Runtime dependencies detected', len(runtime), file=sys.stderr)
                    sys.exit(1)
                print('Zero runtime dependencies verified.')
                break
        else:
            print('ERROR: scrawl package not found', file=sys.stderr)
            sys.exit(1)
        "

  # The Python 3×3 matrix and 552-test jobs are omitted: the Python
  # reference core is not included in this repository.
