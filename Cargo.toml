[package]
name = "scrawl"
version = "1.2.0"
edition = "2021"
authors = [
    "M. L. McKnight <ml.innovations.research.lab@gmail.com>",
    "Korg (AI assistant, Grok Bot)",
]
description = "Structured Compressed Runtime for Agent-to-Agent Workload Language — binary ISA and VM for AI agent communication"
license = "Apache-2.0"
repository = "https://github.com/ZodiacDog/SCRAWL-v1.1"
keywords = ["ai", "agents", "isa", "vm", "communication"]
categories = ["algorithms", "encoding", "simulation"]
rust-version = "1.70"

[dependencies]
# Zero external runtime dependencies

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench_scrawl"
harness = false

[[example]]
name = "heartbeat"

[[example]]
name = "idioms"
